<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Cinemateca Sensorial — Explorador de cine por esencia</title>
    <meta
      name="description"
      content="Explorador cinematográfico de lujo sobre TMDB: catálogo infinito, filtros por vibra y color dominante, análisis cromático de cada film, grafo de afinidades y ensayos de alma gemela."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Cinemateca Sensorial" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cinemateca Sensorial" />
    <meta property="og:title" content="Cinemateca Sensorial — Explorador de cine por esencia" />
    <meta
      property="og:description"
      content="Todas las películas del mundo, agrupadas por esencia, vibración, dilema moral y estética visual."
    />
    <meta property="og:image" content="./og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        background-color: #000000;
        margin: 0;
      }
      #boot-veil {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000000;
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot-veil[data-hidden="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #boot-veil span {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #6a6a6a;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 0.9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-veil span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-veil" aria-hidden="true"><span>Proyectando</span></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var veil = document.getElementById("boot-veil");
        var hide = function () {
          if (!veil) return;
          veil.setAttribute("data-hidden", "true");
          window.setTimeout(function () {
            if (veil && veil.parentNode) veil.parentNode.removeChild(veil);
          }, 460);
        };
        window.addEventListener("cinemateca:ready", hide, { once: true });
        window.addEventListener("load", function () {
          window.setTimeout(hide, 1400);
        });
        window.setTimeout(hide, 4000);
      })();
    </script>
  </body>
</html>
